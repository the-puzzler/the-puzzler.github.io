  <script>
    // Preserve old shared URLs while consolidating every post on /blog/<slug>/.
    (() => {
      const postPath = new URLSearchParams(window.location.search).get('p');
      if (!postPath) return;

      const cleanPath = postPath.replace(/^\/+/, '').replace(/[?#].*$/, '');
      const exactMatch = cleanPath.match(/^posts\/([a-z0-9-]+)\/\1\.html$/i);
      const slug = exactMatch
        ? exactMatch[1]
        : cleanPath.replace(/^posts\//, '').replace(/\.html$/i, '').split('/').filter(Boolean).pop();

      if (/^[a-z0-9-]+$/i.test(slug || '')) {
        window.location.replace(`/blog/${encodeURIComponent(slug)}/${window.location.hash}`);
      }
    })();
  </script>
